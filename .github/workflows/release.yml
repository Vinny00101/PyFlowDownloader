name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build executable
        shell: powershell
        run: |
          ./scripts/build.ps1 -Version "${{ github.ref_name }}" -SkipInstall

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PyFlowDownloader-${{ github.ref_name }}-windows
          path: releases/PyFlowDownloader-${{ github.ref_name }}-windows.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: releases/PyFlowDownloader-${{ github.ref_name }}-windows.zip
          generate_release_notes: true
