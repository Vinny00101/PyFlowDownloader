services:
  postgres:
    image: postgres:16-alpine
    container_name: pyflow-postgres
    environment:
      POSTGRES_DB: pyflow_downloader
      POSTGRES_USER: pyflow
      POSTGRES_PASSWORD: pyflow
    ports:
      - "5432:5432"
    volumes:
      - pyflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pyflow -d pyflow_downloader"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pyflow_postgres_data:
